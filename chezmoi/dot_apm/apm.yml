name: global-agents
version: 2.0.0
description: User-global AI agent dependencies - minimal core external skills and shared MCP (personal @zzizily skills, hooks, and LSP are managed via native channels)
author: Crong
targets:
  - claude
  - codex
dependencies:
  apm:
    - git: vercel-labs/skills
  mcp:
    - name: serena
      registry: false
      transport: stdio
      command: serena
      args:
        - start-mcp-server
        - --context=claude-code
        - --project-from-cwd
includes: auto
scripts: {}
