mcp_servers:
- aperture
- chrome-devtools-mcp
- context7
- dbhub
- doris-mcp-server
- kubernetes-mcp-server
- playwright-mcp
- proxmox-mcp-plus
- serena
- terraform-mcp-server
- web-reader
- web-search-prime
- zai-mcp-server
- zread
mcp_configs:
  aperture:
    name: aperture
    transport: http
    registry: false
    url: https://ai.bun-bull.ts.net/v1/mcp
  chrome-devtools-mcp:
    name: chrome-devtools-mcp
    transport: stdio
    args:
    - -y
    - chrome-devtools-mcp@latest
    registry: false
    command: npx
  context7:
    name: context7
    transport: stdio
    args:
    - -y
    - '@upstash/context7-mcp'
    registry: false
    command: npx
  dbhub:
    name: dbhub
    transport: stdio
    args:
    - -y
    - '@bytebase/dbhub'
    registry: false
    command: npx
  doris-mcp-server:
    name: doris-mcp-server
    transport: stdio
    env:
      DORIS_HOST: ${DORIS_HOST}
      DORIS_PORT: '9030'
      DORIS_USER: ${DORIS_USER}
      DORIS_PASSWORD: ${DORIS_PASSWORD}
      DORIS_DATABASE: information_schema
    args:
    - doris-mcp-server
    - --transport
    - stdio
    registry: false
    command: uvx
  kubernetes-mcp-server:
    name: kubernetes-mcp-server
    transport: stdio
    args:
    - -y
    - kubernetes-mcp-server
    registry: false
    command: npx
  playwright-mcp:
    name: playwright-mcp
    transport: stdio
    args:
    - -y
    - '@playwright/mcp@latest'
    registry: false
    command: npx
  proxmox-mcp-plus:
    name: proxmox-mcp-plus
    transport: stdio
    env:
      PROXMOX_HOST: ${PROXMOX_HOST}
      PROXMOX_USER: ${PROXMOX_USER}
      PROXMOX_TOKEN_NAME: ${PROXMOX_TOKEN_NAME}
      PROXMOX_TOKEN_VALUE: ${PROXMOX_TOKEN_VALUE}
      PROXMOX_PORT: '8006'
      PROXMOX_VERIFY_SSL: 'true'
    args:
    - proxmox-mcp-plus
    registry: false
    command: uvx
  serena:
    name: serena
    transport: stdio
    args:
    - start-mcp-server
    - --context=claude-code
    - --project-from-cwd
    registry: false
    command: serena
  terraform-mcp-server:
    name: terraform-mcp-server
    transport: stdio
    registry: false
    command: terraform-mcp-server
  web-reader:
    name: web-reader
    transport: http
    registry: false
    url: https://api.z.ai/api/mcp/web_reader/mcp
  web-search-prime:
    name: web-search-prime
    transport: http
    registry: false
    url: https://api.z.ai/api/mcp/web_search_prime/mcp
  zai-mcp-server:
    name: zai-mcp-server
    transport: stdio
    env:
      Z_AI_MODE: ZAI
      Z_AI_API_KEY: ${Z_AI_API_KEY}
    args:
    - -y
    - '@z_ai/mcp-server'
    registry: false
    command: npx
  zread:
    name: zread
    transport: http
    registry: false
    url: https://api.z.ai/api/mcp/zread/mcp
