name: global-agents
version: 1.0.0
description: User-global AI agent dependencies - external skills and MCP servers
author: Crong
targets:
  - claude
  - codex
  - gemini
dependencies:
  apm:
    - git: firecrawl/anydoc
    - git: vercel-labs/skills
    - git: obra/superpowers
    - git: Digital-Process-Tools/claude-remember
    - git: deuxksy/ai-agent-skill
  mcp:
    - name: aperture
      registry: false
      transport: http
      url: https://ai.bun-bull.ts.net/v1/mcp
    - name: zread
      registry: false
      transport: http
      url: https://api.z.ai/api/mcp/zread/mcp
    - name: web-reader
      registry: false
      transport: http
      url: https://api.z.ai/api/mcp/web_reader/mcp
    - name: web-search-prime
      registry: false
      transport: http
      url: https://api.z.ai/api/mcp/web_search_prime/mcp
    - name: serena
      registry: false
      transport: stdio
      command: serena
      args:
        - start-mcp-server
        - --context=claude-code
        - --project-from-cwd
    - name: zai-mcp-server
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - '@z_ai/mcp-server'
      env:
        Z_AI_MODE: ZAI
        Z_AI_API_KEY: ${Z_AI_API_KEY}
    - name: chrome-devtools-mcp
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - chrome-devtools-mcp@latest
    - name: dbhub
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - '@bytebase/dbhub'
    - name: kubernetes-mcp-server
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - kubernetes-mcp-server
    - name: playwright-mcp
      registry: false
      transport: stdio
      command: npx
      args:
        - '@playwright/mcp@latest'
includes: auto
scripts: {}
