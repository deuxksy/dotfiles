name: global-agents
version: 1.0.0
description: User-global AI agent dependencies - external skills and MCP servers
author: Crong
targets:
  - claude
  - codex
dependencies:
  apm:
    - git: firecrawl/anydoc
    - git: vercel-labs/skills
    - git: obra/superpowers
    - git: Digital-Process-Tools/claude-remember
    - git: deuxksy/ai-agent-skill
      path: plugins/dev
    - git: deuxksy/ai-agent-skill
      path: plugins/docs
    - git: deuxksy/ai-agent-skill
      path: plugins/git
    - git: deuxksy/ai-agent-skill
      path: plugins/infra
    - git: deuxksy/ai-agent-skill
      path: plugins/jmeter
    - git: deuxksy/ai-agent-skill
      path: plugins/kisa
    - git: deuxksy/ai-agent-skill
      path: plugins/l10n
    - git: deuxksy/ai-agent-skill
      path: plugins/review
    - git: deuxksy/ai-agent-skill
      path: plugins/rules
    - git: deuxksy/ai-agent-skill
      path: plugins/security
    - git: deuxksy/ai-agent-skill
      path: plugins/sessions
    - git: deuxksy/ai-agent-skill
      path: plugins/trackers
    - git: alibaba/open-code-review
      path: skills/open-code-review
    - git: cloudflare/security-audit-skill
      path: skills/security-audit
    - git: Tencent/WeKnora
      path: cli/skills/weknora-shared
    - git: Tencent/WeKnora
      path: cli/skills/weknora-rag-search
  mcp:
    - name: context7
      registry: false
      transport: stdio
      command: npx
      args:
      - -y
      - '@upstash/context7-mcp'
    - name: doris-mcp-server
      registry: false
      transport: stdio
      command: uvx
      args:
      - doris-mcp-server
      - --transport
      - stdio
      env:
        DORIS_HOST: ${DORIS_HOST}
        DORIS_PORT: '9030'
        DORIS_USER: ${DORIS_USER}
        DORIS_PASSWORD: ${DORIS_PASSWORD}
        DORIS_DATABASE: information_schema
    - name: proxmox-mcp-plus
      registry: false
      transport: stdio
      command: uvx
      args:
      - proxmox-mcp-plus
      env:
        PROXMOX_HOST: ${PROXMOX_HOST}
        PROXMOX_USER: ${PROXMOX_USER}
        PROXMOX_TOKEN_NAME: ${PROXMOX_TOKEN_NAME}
        PROXMOX_TOKEN_VALUE: ${PROXMOX_TOKEN_VALUE}
        PROXMOX_PORT: '8006'
        PROXMOX_VERIFY_SSL: 'true'
    - name: terraform-mcp-server
      registry: false
      transport: stdio
      command: terraform-mcp-server
    - name: aperture
      registry: false
      transport: http
      url: https://ai.bun-bull.ts.net/v1/mcp
    - name: zread
      registry: false
      transport: http
      url: https://api.z.ai/api/mcp/zread/mcp
    - name: web-reader
      registry: false
      transport: http
      url: https://api.z.ai/api/mcp/web_reader/mcp
    - name: web-search-prime
      registry: false
      transport: http
      url: https://api.z.ai/api/mcp/web_search_prime/mcp
    - name: serena
      registry: false
      transport: stdio
      command: serena
      args:
        - start-mcp-server
        - --context=claude-code
        - --project-from-cwd
    - name: zai-mcp-server
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - '@z_ai/mcp-server'
      env:
        Z_AI_MODE: ZAI
        Z_AI_API_KEY: ${Z_AI_API_KEY}
    - name: chrome-devtools-mcp
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - chrome-devtools-mcp@latest
    - name: dbhub
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - '@bytebase/dbhub'
    - name: kubernetes-mcp-server
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - kubernetes-mcp-server
    - name: playwright-mcp
      registry: false
      transport: stdio
      command: npx
      args:
        - -y
        - '@playwright/mcp@latest'
includes: auto
scripts: {}
