mcp_servers:
- aperture
- chrome-devtools-mcp
- dbhub
- kubernetes-mcp-server
- playwright-mcp
- serena
- web-reader
- web-search-prime
- zai-mcp-server
- zread
mcp_configs:
  aperture:
    name: aperture
    transport: http
    registry: false
    url: https://ai.bun-bull.ts.net/v1/mcp
  chrome-devtools-mcp:
    name: chrome-devtools-mcp
    transport: stdio
    args:
    - -y
    - chrome-devtools-mcp@latest
    registry: false
    command: npx
  dbhub:
    name: dbhub
    transport: stdio
    args:
    - -y
    - '@bytebase/dbhub'
    registry: false
    command: npx
  kubernetes-mcp-server:
    name: kubernetes-mcp-server
    transport: stdio
    args:
    - -y
    - kubernetes-mcp-server
    registry: false
    command: npx
  playwright-mcp:
    name: playwright-mcp
    transport: stdio
    args:
    - '@playwright/mcp@latest'
    registry: false
    command: npx
  serena:
    name: serena
    transport: stdio
    args:
    - start-mcp-server
    - --context=claude-code
    - --project-from-cwd
    registry: false
    command: serena
  web-reader:
    name: web-reader
    transport: http
    registry: false
    url: https://api.z.ai/api/mcp/web_reader/mcp
  web-search-prime:
    name: web-search-prime
    transport: http
    registry: false
    url: https://api.z.ai/api/mcp/web_search_prime/mcp
  zai-mcp-server:
    name: zai-mcp-server
    transport: stdio
    env:
      Z_AI_MODE: ZAI
      Z_AI_API_KEY: ${Z_AI_API_KEY}
    args:
    - -y
    - '@z_ai/mcp-server'
    registry: false
    command: npx
  zread:
    name: zread
    transport: http
    registry: false
    url: https://api.z.ai/api/mcp/zread/mcp
mcp_target_servers: {}
