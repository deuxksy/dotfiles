# himalaya v2 — hiworks 계정 (사양: docs/superpowers/specs/2026-11-07-hiworks-mail-design.md)
# 수신: getmail이 Maildir에 적립 (himalaya는 maildir backend로 조회만)
# 발송: SMTP 465 SSL, 비밀번호는 command로 로컬 .env에서만 조회
[accounts.hiworks]
default = true
email = "crong@kyolimsoft.com"
display-name = "김석영"

# v2 문법: v1 backend.* 테이블은 v2에서 무시됨 (MIGRATION.md)
maildir.root = "~/.local/share/hiworks-mail"

smtp.server = "smtps://smtps.hiworks.com:465"
smtp.sasl.plain.authcid = "crong@kyolimsoft.com"
smtp.sasl.plain.passwd.command = "sh -c 'grep ^HIWORKS_MAIL_PASS= ~/.config/hiworks/.env | cut -d= -f2-'"

# Maildir에 Sent 폴더 없음 — 발송 사본 저장 시도로 인한 에러 방지
message.send.save-copy = false
