[hooks]
enter = "git pull --ff-only"

[tools]
"aqua:gitleaks/gitleaks" = "latest"
"aqua:koalaman/shellcheck" = "latest"

[tasks."lint:shell"]
description = "Lint repository shell scripts with shellcheck"
sources = ["install.sh", ".githooks/pre-push", "*/scripts/install_nvtools.sh"]
run = "shellcheck -e SC2034 install.sh .githooks/pre-push */scripts/install_nvtools.sh"

[tasks."lint:secrets"]
description = "Scan staged changes and unpushed commits for leaked secrets with gitleaks"
shell = "bash -c"
run = '''
set -euo pipefail
gitleaks git --staged --no-banner
if git rev-parse --verify origin/main >/dev/null 2>&1; then
  if [[ -n "$(git log origin/main..HEAD --oneline)" ]]; then
    gitleaks git --log-opts="origin/main..HEAD" --no-banner
  fi
fi
'''

[tasks."stow:check"]
description = "Dry-run GNU Stow symlink check (--no-folding)"
usage = 'arg "[host]" help="Optional host package override"'
shell = "bash -c"
run = '''
set -euo pipefail
STOW_DIR="${MISE_PROJECT_ROOT:-$PWD}"
TMP_TARGET="$(mktemp -d)"
trap 'rm -rf "$TMP_TARGET"' EXIT
if [[ -n "${usage_host:-}" ]]; then
  HOST="$usage_host"
  if [[ ! -d "$STOW_DIR/$HOST" ]]; then
    echo "stow:check: host package directory '$HOST' not found" >&2
    exit 1
  fi
  stow --no-folding -n -v -d "$STOW_DIR" -t "$TMP_TARGET" base "$HOST"
else
  HOST="$(hostname -s | tr '[:upper:]' '[:lower:]')"
  if [[ -d "$STOW_DIR/$HOST" ]]; then
    stow --no-folding -n -v -d "$STOW_DIR" -t "$TMP_TARGET" base "$HOST"
  else
    echo "stow:check: host '$HOST' has no package dir; checking base only"
    stow --no-folding -n -v -d "$STOW_DIR" -t "$TMP_TARGET" base
  fi
fi
'''

[tasks."test:windows"]
description = "Run Windows install.ps1 Pester regression tests"
shell = "bash -c"
run = '''
set -euo pipefail
if command -v pwsh >/dev/null 2>&1; then
  pwsh -NoProfile -Command 'Invoke-Pester -CI windows/tests/*.Tests.ps1'
else
  echo "[skip] pwsh not installed — skipping Windows Pester tests"
fi
'''

[tasks.verify]
description = "Run all repository verification checks in parallel"
depends = ["lint:shell", "lint:secrets", "stow:check", "test:windows"]

[tasks.doctor]
description = "Check host dotfiles invariants (hooksPath, symlinks, sops, binaries)"
shell = "bash -c"
run = '''
set -uo pipefail
FAIL=0

check() {
  local label="$1"
  shift
  if "$@" >/dev/null 2>&1; then
    echo "[OK]   $label"
  else
    echo "[FAIL] $label"
    FAIL=1
  fi
}

check "git core.hooksPath == .githooks" test "$(git config --get core.hooksPath 2>/dev/null || true)" = ".githooks"
check "~/.apm/apm.yml is symlink" test -L "$HOME/.apm/apm.yml"
check "~/.claude/settings.json is symlink" test -L "$HOME/.claude/settings.json"
check "~/.key decryptable via sops" bash -c 'test -f "$HOME/.key" && sops -d "$HOME/.key" >/dev/null 2>&1'

for bin in stow sops age gitleaks shellcheck; do
  check "binary available: $bin" command -v "$bin"
done

exit "$FAIL"
'''

[tasks."sops:check"]
description = "Verify decryption of ~/.key and Claude sops profiles"
shell = "bash -c"
run = '''
set -euo pipefail
FAIL=0

if [[ -f "$HOME/.key" ]]; then
  if sops -d "$HOME/.key" >/dev/null 2>&1; then
    echo "[OK]   ~/.key"
  else
    echo "[FAIL] ~/.key (decryption failed)"
    FAIL=1
  fi
else
  echo "[FAIL] ~/.key (file not found)"
  FAIL=1
fi

for f in base/.config/claude/profiles/*.env.sops; do
  [[ -f "$f" ]] || continue
  if sops -d --input-type dotenv --output-type dotenv "$f" >/dev/null 2>&1; then
    echo "[OK]   $f"
  else
    echo "[FAIL] $f (decryption failed)"
    FAIL=1
  fi
done

exit "$FAIL"
'''

[tasks."hooks:install"]
description = "Configure repository Git hooksPath to .githooks"
run = "git config core.hooksPath .githooks && echo 'core.hooksPath set to .githooks'"

[tasks."apm:repair"]
description = "Repair R8 broken ~/.apm/apm.yml symlink and migrate apm.lock.yaml"
shell = "bash -c"
run = '''
set -euo pipefail
STOW_DIR="${MISE_PROJECT_ROOT:-$PWD}"
REPAIRED=0

if [[ -e "$HOME/.apm/apm.yml" && ! -L "$HOME/.apm/apm.yml" ]]; then
  BAK="$HOME/.apm/apm.yml.bak-$(date +%Y%m%d%H%M%S)"
  cp "$HOME/.apm/apm.yml" "$BAK"
  rm -f "$HOME/.apm/apm.yml"
  stow --no-folding -R -d "$STOW_DIR" -t "$HOME" base
  echo "Repaired ~/.apm/apm.yml symlink (backup: $BAK)"
  REPAIRED=1
fi

if [[ -f "$HOME/.apm/apm.lock.yaml" && ! -L "$HOME/.apm/apm.lock.yaml" ]]; then
  cp "$HOME/.apm/apm.lock.yaml" "$STOW_DIR/base/.apm/apm.lock.yaml"
  rm -f "$HOME/.apm/apm.lock.yaml"
  stow --no-folding -R -d "$STOW_DIR" -t "$HOME" base
  echo "Migrated ~/.apm/apm.lock.yaml to base/.apm/apm.lock.yaml (commit required)"
  REPAIRED=1
fi

if [[ "$REPAIRED" -eq 0 ]]; then
  echo "apm symlinks OK (no-op)"
fi
'''

[tasks."sops:edit"]
description = "Edit an encrypted Claude dotenv profile with sops (usage: mise run sops:edit <zai|kimi|aperture|mcp>)"
usage = 'arg "[profile]" help="Profile name (zai, kimi, aperture, mcp)"'
shell = "bash -c"
run = '''
set -euo pipefail
PROFILE="${usage_profile:-}"
TARGET="base/.config/claude/profiles/${PROFILE}.env.sops"
if [[ -z "$PROFILE" || ! -f "$TARGET" ]]; then
  echo "Usage: mise run sops:edit <profile>" >&2
  echo "Available profiles:" >&2
  for f in base/.config/claude/profiles/*.env.sops; do
    basename "$f" .env.sops | sed 's/^/  - /' >&2
  done
  exit 1
fi
exec sops --input-type dotenv --output-type dotenv "$TARGET"
'''
