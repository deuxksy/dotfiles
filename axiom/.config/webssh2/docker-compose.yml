services:
  webssh2:
    image: ghcr.io/billchurch/webssh2:latest
    container_name: webssh2
    ports:
      - "2222:2222"
    volumes:
      - ${HOME}/.local/share/webssh2/hosts/axiom.json:/srv/webssh2/config.json:ro
      - webssh2-data:/data
    environment:
      # tailnet 대역 외 목적지 차단 — 방문자 자격증명 open proxy 방지
      WEBSSH2_SSH_ALLOWED_SUBNETS: 100.64.0.0/10
    restart: unless-stopped

volumes:
  webssh2-data:
